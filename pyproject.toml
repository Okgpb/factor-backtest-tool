[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-factor-backtest"
version = "0.1.0"
description = "Cross-sectional factor backtesting for crypto perpetual futures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Okgpb" }]
dependencies = [
  "matplotlib>=3.6",
  "numpy>=1.23",
  "pandas>=1.5",
  "pyarrow>=10",
  "PyYAML>=6",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
crypto-factor-backtest = "crypto_factor_backtest.cli:main"
crypto-factor-download = "crypto_factor_backtest.binance:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
