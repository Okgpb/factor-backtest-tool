name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        dependencies: [latest]
        include:
          - python-version: "3.10"
            dependencies: minimum-pandas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - if: matrix.dependencies == 'minimum-pandas'
        run: python -m pip install "numpy<2" "pandas==1.5.3"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python scripts/run_crypto_factor_backtest.py --test-data --output-dir output/ci
